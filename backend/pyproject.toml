[project]
name = "breezetts-backend"
version = "0.1.0"
description = "Breeze TTS 2 local inference server (MLX on Apple Silicon)"
requires-python = ">=3.11"
dependencies = [
    "mlx-audio>=0.4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "soundfile>=0.13",
    "numpy>=2.0",
    "python-multipart>=0.0.18",
    "modelscope>=1.20",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
